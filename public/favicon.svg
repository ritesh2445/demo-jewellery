<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#161616"/>
  <!-- Diamond gem shape in brand gold -->
  <!-- Top crown -->
  <polygon points="16,4 10,11 22,11" fill="#b69b68" opacity="0.95"/>
  <!-- Left facets -->
  <polygon points="4,11 10,11 7,20" fill="#b69b68" opacity="0.7"/>
  <!-- Right facets -->
  <polygon points="28,11 22,11 25,20" fill="#b69b68" opacity="0.7"/>
  <!-- Top-left crown panels -->
  <polygon points="4,11 10,11 16,4" fill="#b69b68" opacity="0.55"/>
  <!-- Top-right crown panels -->
  <polygon points="28,11 22,11 16,4" fill="#b69b68" opacity="0.55"/>
  <!-- Main pavilion left -->
  <polygon points="4,11 7,20 16,28" fill="#b69b68" opacity="0.8"/>
  <!-- Main pavilion right -->
  <polygon points="28,11 25,20 16,28" fill="#b69b68" opacity="0.8"/>
  <!-- Center girdle -->
  <polygon points="7,20 10,11 22,11 25,20 16,28" fill="#b69b68" opacity="0.6"/>
  <!-- Outline for crispness -->
  <polygon points="16,4 10,11 4,11 7,20 16,28 25,20 28,11 22,11" fill="none" stroke="#b69b68" stroke-width="0.8" opacity="0.9"/>
  <line x1="10" y1="11" x2="16" y2="4" stroke="#161616" stroke-width="0.5" opacity="0.4"/>
  <line x1="22" y1="11" x2="16" y2="4" stroke="#161616" stroke-width="0.5" opacity="0.4"/>
  <line x1="10" y1="11" x2="25" y2="20" stroke="#161616" stroke-width="0.3" opacity="0.3"/>
  <line x1="22" y1="11" x2="7" y2="20" stroke="#161616" stroke-width="0.3" opacity="0.3"/>
  <line x1="7" y1="20" x2="25" y2="20" stroke="#161616" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="11" x2="16" y2="28" stroke="#161616" stroke-width="0.3" opacity="0.25"/>
</svg>
